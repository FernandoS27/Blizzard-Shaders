name: Build SPIR-V + WGSL BLS

# Compiles every core wc3_shaders permutation to SPIR-V (Vulkan) and WGSL
# (WebGPU) and repacks the v1.14 BLS bundles
# (shaders/<stage>/{spv_<X_Y>,wgsl_1_0}/*.bls), then uploads them.
#
# Both backends are fully Linux-buildable — slangc emits SPIR-V and WGSL
# without any platform toolchain — so this runs entirely on ubuntu (no
# macOS minutes). build_bls.py applies the SPIR-V output-location fixup at
# pack time; the WGSL entry-rename / depth-texture fixups run in slangc at
# compile time. Layout metadata comes from the committed
# wc3_bls_templates.json. Only core wc3 families build by default.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  # shader-slang/slang release. Must name a tag that actually exists —
  # setup-slang fails the build rather than silently floating onto the
  # latest compiler. Keep in step with build-metal-bls.yml.
  SLANG_VERSION: "2026.9.2"

  # ffxcmaaedge1 / ffxcmaaedgecombine cannot be expressed in WGSL (they
  # need unorm storage textures, which WGSL has no format for), so they are
  # excluded by name instead of by a blanket tolerance — that way a *new*
  # WGSL failure still fails the build.
  WGSL_UNSUPPORTED: "--allow ffxcmaaedge1:webgpu --allow ffxcmaaedgecombine:webgpu"

jobs:
  build:
    name: Compile + pack (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup slangc
        uses: ./.github/actions/setup-slang
        with:
          version: ${{ env.SLANG_VERSION }}
          token: ${{ github.token }}

      - name: Compile SPIR-V
        run: python3 compile_all_slang.py --target vulkan --slangc "$SLANGC"

      - name: Compile WGSL
        run: python3 compile_all_slang.py --target webgpu --slangc "$SLANGC"

      # Neither compile_all_slang.py nor build_bls.py can fail on its own
      # (both always exit 0), so these are the steps that notice a family
      # dropping out of the grid.
      - name: Verify every perm compiled
        run: |
          python3 tools/check_build_coverage.py --compiled vulkan
          python3 tools/check_build_coverage.py --compiled webgpu $WGSL_UNSUPPORTED

      - name: Pack BLS
        run: python3 build_bls.py --output bls_out --verbose

      - name: Verify every BLS bundle
        run: |
          python3 tools/check_build_coverage.py --packed vulkan --bls-out bls_out
          python3 tools/check_build_coverage.py --packed webgpu --bls-out bls_out $WGSL_UNSUPPORTED

      - name: Upload BLS artifact
        uses: actions/upload-artifact@v4
        with:
          name: wc3-spirv-wgsl-bls
          # Only SPIR-V + WGSL compiled, so the v1.14 tree holds just the
          # spv_<X_Y> and wgsl_1_0 bundles (no v1.8 for these backends).
          path: bls_out_1_14/
          if-no-files-found: error
